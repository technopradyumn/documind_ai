version: "3.9"

services:
  # ── Vector DB (RAG + Memory) ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind_qdrant_prod
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # ── Conversation Checkpointing ───────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: documind_mongo_prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin}
    volumes:
      - mongo_data:/data/db
    restart: always

  # ── Job Queue ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: documind_redis_prod
    restart: always

  # ── API Backend ──────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: documind_backend_prod
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - qdrant
      - mongodb
      - redis
    restart: always

  # ── RQ Worker (PDF Indexing) ─────────────────────────────────────────────────
  worker:
    build: ./backend
    container_name: documind_worker_prod
    command: rq worker documind --url redis://redis:6379
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-admin}@mongodb:27017
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
    restart: always

  # ── Frontend (Nginx Proxy) ───────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: documind_frontend_prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  qdrant_data:
  mongo_data:
  uploads:
