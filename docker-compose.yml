version: "3.9"

services:
  # ── Vector DB (RAG + Memory) ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: documind_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # ── Conversation Checkpointing ───────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: documind_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ── Job Queue ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: documind_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ── API Backend ──────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: documind_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - qdrant
      - mongodb
      - redis
    restart: unless-stopped

  # ── RQ Worker (PDF Indexing) ─────────────────────────────────────────────────
  worker:
    build: ./backend
    container_name: documind_worker
    command: rq worker documind --url redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    depends_on:
      - redis
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  mongo_data:
  uploads:
